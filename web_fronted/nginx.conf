server {
    listen 80;
    root /usr/share/nginx/html;
    index login.html;

    # Static pages
    location / {
        try_files $uri $uri/ =404;
    }

    # API calls from the browser go to the Spring Boot container (same origin, no CORS needed)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # the LLM can take a while to answer
    }
}
