<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès refusé</title>
    <link rel="stylesheet" href="styles/theme.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #fdeaea 0%, var(--color-bg) 55%);
        }
        .unauthorized-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 48px 44px;
            text-align: center;
            max-width: 420px;
        }
        .unauthorized-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--color-danger-bg);
            color: var(--color-danger);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }
        .unauthorized-card h1 {
            font-size: 20px;
            margin: 0 0 8px;
        }
        .unauthorized-card p {
            color: var(--color-text-muted);
            font-size: 14px;
            margin: 0 0 24px;
        }
    </style>
</head>
<body>
    <div class="unauthorized-card">
        <div class="unauthorized-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg>
        </div>
        <h1>Accès refusé</h1>
        <p>Ton compte n'a pas la permission de voir cette page.</p>
        <button class="btn btn-primary" onclick="window.location.href='login.html'">Retour à la connexion</button>
    </div>
</body>
</html>
