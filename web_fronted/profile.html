<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon profil</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
    <div class="app-shell">
        <div class="app-main" style="margin-left:0;">
            <header class="app-header">
                <div class="app-header-left">
                    <a href="#" id="backLink" class="app-header-title" style="text-decoration:none;">&larr; Retour</a>
                </div>
                <div class="app-header-right">
                    <button class="app-logout-btn" id="logoutBtn">Se deconnecter</button>
                </div>
            </header>

            <main class="app-content">
                <section class="app-section active">
                    <div class="section-heading">
                        <div>
                            <h1>Mon profil</h1>
                            <p>Consulter et modifier mes informations</p>
                        </div>
                    </div>

                    <div class="admin-split">
                        <div class="card">
                            <div class="card-title">Informations</div>
                            <div class="form-field">
                                <label>Nom</label>
                                <input id="profileName" type="text">
                            </div>
                            <div class="form-field">
                                <label>Prenom</label>
                                <input id="profilePrenom" type="text">
                            </div>
                            <div class="form-field">
                                <label>Email</label>
                                <input id="profileEmail" type="text" disabled>
                            </div>
                            <div class="form-field" id="extraFieldWrap" style="display:none;">
                                <label id="extraFieldLabel"></label>
                                <input id="extraFieldValue" type="text" disabled>
                            </div>
                            <button class="btn btn-primary" id="saveInfoBtn" style="margin-top:14px;">Enregistrer</button>
                        </div>

                        <div class="card">
                            <div class="card-title">Changer le mot de passe</div>
                            <div class="form-field">
                                <label>Mot de passe actuel</label>
                                <input id="currentPassword" type="password">
                            </div>
                            <div class="form-field">
                                <label>Nouveau mot de passe</label>
                                <input id="newPassword" type="password">
                            </div>
                            <button class="btn btn-primary" id="savePasswordBtn" style="margin-top:14px;">Changer le mot de passe</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script type="module" src="script/profile.js"></script>
</body>
</html>
