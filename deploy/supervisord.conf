[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --bind-address=127.0.0.1
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ai]
command=/app/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/ai
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:backend]
command=/bin/bash -c 'until mariadb-admin ping --silent; do sleep 1; done; exec java -Xmx400m -jar /app/app.jar'
priority=10
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
