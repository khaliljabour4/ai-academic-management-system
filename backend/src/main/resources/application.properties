spring.application.name=backend

# Load values from a .env file (project root or backend/) if present.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Secrets and environment-specific values come from environment variables (see .env.example).
# The app refuses to start if DB_PASSWORD or JWT_SECRET is missing.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/SchoolManagement?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000/ai/ask}
ml.service.url=${ML_SERVICE_URL:http://localhost:8000/ml/predict-success}
ml.progress.url=${ML_PROGRESS_URL:http://localhost:8000/ml/predict-progress}

# First administrator (created at startup only if it does not exist yet)
bootstrap.admin.email=${ADMIN_EMAIL:}
bootstrap.admin.password=${ADMIN_PASSWORD:}
